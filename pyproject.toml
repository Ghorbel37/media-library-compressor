[project]
name = "media-library-optimizer"
version = "0.4.0"
description = "A command line tool to optimize media while preserving quality, metadata and timestamps."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ffmpeg-python>=0.2.0",
    "pillow>=12.1.1",
    "typer>=0.27.3",
    "win32-setctime>=1.2.0; sys_platform == 'win32'",
]

[project.scripts]
mlo = "media_library_optimizer.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["media_library_optimizer*"]
