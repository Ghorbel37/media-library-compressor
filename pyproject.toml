[project]
name = "media-compressor"
version = "0.1.0"
description = " Windows-oriented toolkit for batch video downscaling and image recompression via FFmpeg, Pillow and ExifTool."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.1.1",
    "python-ffmpeg>=2.0.12",
    "win32-setctime>=1.2.0",
]
